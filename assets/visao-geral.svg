    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8f6f2"/><stop offset="1" stop-color="#e9edf3"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#102344" flood-opacity=".12"/></filter>
  </defs>
